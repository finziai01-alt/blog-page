<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Finzi AI — social card (1200×630)</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px;
    background: linear-gradient(150deg, #1E40AF 0%, #2563EB 100%);
    color: #fff;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  .logo { display: flex; align-items: center; gap: 18px; font-size: 44px; font-weight: 800; }
  .logo em { font-style: normal; color: #93C5FD; }
  .logo svg { width: 54px; height: 54px; }
  h1 { font-size: 70px; line-height: 1.12; font-weight: 800; margin-top: 36px; max-width: 940px; letter-spacing: -0.01em; }
  p { margin-top: 26px; font-size: 27px; color: #DBEAFE; }
</style>
</head>
<body>
<div class="card" role="img" aria-label="Finzi AI social card">
  <div class="logo">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 12 C35.6 26.2 37.8 28.4 52 32 C37.8 35.6 35.6 37.8 32 52 C28.4 37.8 26.2 35.6 12 32 C26.2 28.4 28.4 26.2 32 12 Z" fill="#FFFFFF"/></svg>
    FINZI <em>ai</em>
  </div>
  <h1>Bills read. Payments matched. Books honest.</h1>
  <p>AI accounting assistant for Indian accountants and their clients.</p>
</div>
</body>
</html>
